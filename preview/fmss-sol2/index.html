   one clock. As in the prototypes' render(), every layer is a pure function of the sheet progress: the media's x, y, width, height

   sync (below): the thumbnail v4 (22.033s) plays t1-t4 (14.83s) from 0:00; the reel r4 (6.9s) plays t4 -> t1e (5.81s) and is

    `L0 ${q0.p}c0 ${-q0.A} 0 ${-q0.AB} ${q0.D} ${-q0.ABC}a${q0.r} ${q0.r} 0 0 1 ${q0.S} ${-q0.S}c${q0.C} ${-q0.D} ${q0.BC} ${-q0.D} ${q0.ABC} ${-q0.D}Z`;
