<style>
.mo-hero{padding-bottom:clamp(24px,4vw,40px)}
.mo-hero h1{max-width:none}
#morph-track{--bar:58px;position:relative;height:calc(100vh + 60vh)}
.mo-sticky{overscroll-behavior:contain}
.mo-sticky{position:sticky;top:var(--bar);height:calc(100vh - var(--bar));height:calc(100svh - var(--bar));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#morph-stage{position:relative;width:min(100%,calc((100vh - var(--bar) - 88px) * 16 / 9));width:min(100%,calc((100svh - var(--bar) - 88px) * 16 / 9));aspect-ratio:16/9;overflow:hidden;border-radius:clamp(10px,1.6vw,20px);background:#f4f4f4;box-shadow:0 0 0 1px var(--line);contain:layout paint;isolation:isolate}
#morph-stage-inner{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#morph-stage .ml{position:absolute;box-sizing:border-box}#morph-stage .ml.deck-cv{background:none!important}#morph-stage .ml.deck-cv::after{content:"";position:absolute;inset:0;background:currentColor;opacity:var(--cvfo,0);pointer-events:none}
#morph-stage svg{position:absolute;left:0;top:0;display:block}
#morph-stage img{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
#morph-stage .mt{box-sizing:border-box;font-kerning:normal;-webkit-font-smoothing:antialiased}
/* stage container = the site standard .media box colour (--frame): #f4f4f4 light / #222 dark */
html[data-theme=dark] #morph-stage{background:#222}
/* the art switches palette instantly; keep the site-wide 0.3s theme cross-fade off the stage so letters and canvas flip together */
html.theme-anim #morph-stage,html.theme-anim #morph-stage *{transition:none!important}
#morph-cap{font:400 12px/1.5 var(--mono);color:var(--faint);letter-spacing:.04em;white-space:pre;min-height:1.5em}
@media (max-width:640px){#morph-track{--bar:50px}}
</style>
