:root{--bg:#090C94;--ink:#F8F7FC;--btn:#EBEBF6;--btnInk:#090C94;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:'MontserratEmbed',Montserrat,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#stage{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;position:relative;background:var(--bg)}
#stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
text{font-family:'MontserratEmbed',Montserrat,Arial,sans-serif}
.glow{filter:drop-shadow(0 0 2px rgba(255,255,255,.55)) drop-shadow(0 0 7px rgba(190,195,255,.45))}
.glowSoft{filter:drop-shadow(0 0 2px rgba(255,255,255,.5)) drop-shadow(0 0 5px rgba(190,195,255,.35))}
.hair{stroke:#A3A6F2;stroke-width:1.25;fill:none;stroke-linecap:butt}
.guide{stroke:#F4F4FF;stroke-width:1.8;fill:none;stroke-linecap:butt}  /* v8: matches .bline (THAT DELIVER + START lines) */
.bline{stroke:#F4F4FF;stroke-width:1.8;fill:none;stroke-linecap:square}
#btn{cursor:pointer}
#btn .face{transition:filter .35s ease}
#btn .face{filter:drop-shadow(0 0 3px rgba(255,255,255,.55)) drop-shadow(0 0 9px rgba(200,205,255,.4))}
#btn:focus{outline:none}
#replay{position:fixed;right:18px;bottom:16px;z-index:5;background:transparent;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.7);
  font:600 11px/1 'MontserratEmbed',Montserrat,Arial,sans-serif;letter-spacing:.22em;padding:9px 12px 8px;cursor:pointer;opacity:.55;transition:opacity .25s,border-color .25s}
#replay:hover{opacity:1;border-color:rgba(255,255,255,.7)}
body.capture #replay{display:none}
/* ===== HOME (split) — all sizes in 1920-px design values × --u ===== */
:root{--blue:#1626C6;--red:#C7132D;--u:min(calc(100vw / 1920),calc(100vh / 1080))}
#home{position:fixed;inset:0;z-index:3;visibility:hidden;font-family:'MontserratEmbed',Montserrat,Arial,sans-serif;color:#fff;user-select:none;-webkit-tap-highlight-color:transparent}
body.onHome #home{visibility:visible}
body.onHome #replay{display:none}
.side{position:absolute;inset:0;cursor:pointer;outline:none}
#sideB .sideBg{position:absolute;inset:0;background:var(--blue)}
#sideR .sideBg{position:absolute;inset:0;background:var(--red)}
.art{position:absolute;left:0;top:0;transform-origin:50% 50%;pointer-events:none;will-change:opacity,transform}
.art canvas,.art img{display:block;width:100%;height:100%}
/* house GIF: its faint radar rings reach the frame edges (dithered, <=23 RGB-sum from the fill). Feather the frame 24 GIF px into the
   side fill (fill == GIF background) so no rectangle edge can show. The business GIF has nothing within 24px of its edges except one
   orbit dot near the top, so it is left unmasked. */
#artR0 canvas,#artR0 img{-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(180deg,transparent,#000 5%,#000 95%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(180deg,transparent,#000 5%,#000 95%,transparent);mask-composite:intersect}
#split{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.sline{stroke:#F4F4FF;stroke-width:1.8;fill:none;stroke-linecap:butt;filter:drop-shadow(0 0 2px rgba(255,255,255,.55)) drop-shadow(0 0 6px rgba(200,205,255,.45))}
#brand{position:absolute;left:0;top:0;pointer-events:none}
#hEagle{position:absolute;left:calc(54.04 * var(--u));top:calc(54.04 * var(--u));width:calc(80.36 * var(--u));height:calc(50.96 * var(--u));overflow:visible}
#hDiv{position:absolute;left:calc(155 * var(--u));top:calc(56 * var(--u));width:max(1px,calc(2 * var(--u)));height:calc(44 * var(--u));background:rgba(255,255,255,.55)}
#hWord{position:absolute;left:calc(181 * var(--u));top:calc(78.8 * var(--u));font-weight:800;font-size:calc(27.43 * var(--u));letter-spacing:.024em;line-height:0;white-space:nowrap}
.glowT,#hWord,.cta p{text-shadow:0 0 calc(3 * var(--u)) rgba(255,255,255,.4),0 0 calc(10 * var(--u)) rgba(255,255,255,.16)}
#hEagle{filter:drop-shadow(0 0 calc(3 * var(--u)) rgba(255,255,255,.3))}
.cta{position:absolute;top:50%;pointer-events:none;white-space:nowrap}
.ctaT{position:absolute;left:0;top:0;will-change:transform} #ctaR .ctaT{left:auto;right:0}

}

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const CFG={hLeft:357,hRight:1563,hBase:513.5,hSize:161,hCap:113,
  tdW:711,b1W:1085,b2W:1038};

// fit letter-spacing so ink width ≈ target (text-anchor middle; compensate trailing spacing)
function fitSpacing(el,target){
  el.setAttribute('letter-spacing',0);
  const n=el.getNumberOfChars(); const w=el.getComputedTextLength();
  const ls=(target-w)/(n-1);
  el.setAttribute('letter-spacing',ls.toFixed(3));
  el.setAttribute('x',(960+ls/2).toFixed(2));
}

function build(){
  // headline: one <text> per letter so each can be drawn independently
  const m=$('hMeasure'), str=m.textContent, n=str.length;
  m.setAttribute('letter-spacing',0);
  const natural=m.getComputedTextLength();
  const ls=(CFG.hRight-CFG.hLeft-natural)/(n-1)+1.5;
  m.setAttribute('letter-spacing',ls);
  const g=$('headline'); g.innerHTML='';
  const boxes=[];
  const total=natural+ls*(n-1);
  const x0=960-total/2+-4;
  for(let i=0;i<n;i++){
    const ex=m.getExtentOfChar(i);
    const x=x0+ex.x; const w=ex.width-(i<n-1?ls:0); // glyph advance without spacing
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',x.toFixed(2)); t.setAttribute('y',CFG.hBase);
    t.setAttribute('font-size',CFG.hSize); t.setAttribute('font-weight',800);
    t.setAttribute('fill','#F8F7FC'); t.setAttribute('stroke','#FFFFFF'); t.setAttribute('stroke-width','1.6');
    t.setAttribute('class','hl'); t.textContent=str[i];
    g.appendChild(t);
    boxes.push({ch:str[i],x:x,w:ex.width-ls});
  }
  // construction (blueprint) guides
  const G=$('guides'); G.innerHTML='';
  const top=CFG.hBase-CFG.hCap, base=CFG.hBase, ext=14;
  const L=(x1,y1,x2,y2)=>{const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',x1.toFixed(1));l.setAttribute('y1',y1.toFixed(1));l.setAttribute('x2',x2.toFixed(1));l.setAttribute('y2',y2.toFixed(1));
    l.setAttribute('class','guide');l.dataset.x1=x1;l.dataset.y1=y1;l.dataset.x2=x2;l.dataset.y2=y2;G.appendChild(l);};
  const ext2=(x1,y1,x2,y2,e)=>{const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy);L(x1-dx/d*e,y1-dy/d*e,x2+dx/d*e,y2+dy/d*e);};
  // guide positions measured from the designer mockup (1920x1080 space), ordered left to right
  const GUIDES=[[356.61,387.33,356.61,528.00],[443.72,387.33,443.72,528.00],[519.63,387.33,519.63,528.00],[574.66,387.33,574.66,528.00],[650.53,387.33,650.53,528.00],[731.00,387.33,731.00,528.00],[926.95,387.33,866.93,528.00],[967.10,387.33,904.99,528.00],[1070.78,387.33,1070.78,528.00],[1149.83,387.33,1149.83,528.00],[1262.50,387.33,1262.50,528.00],[1342.69,387.33,1342.69,528.00],[1418.58,387.33,1418.58,528.00],[1561.65,387.33,1465.40,528.00]];
  GUIDES.forEach(g=>L(...g));
  // supporting text fit
  fitSpacing($('tdText'),CFG.tdW); fitSpacing($('b1'),CFG.b1W); fitSpacing($('b2'),CFG.b2W);
}

let tl;
function makeTimeline(){
  if(tl){tl.kill();}
  const hls=[...document.querySelectorAll('.hl')];
  const guides=[...document.querySelectorAll('#guides line')];
  const lineLen=el=>Math.hypot(el.x2.baseVal.value-el.x1.baseVal.value,el.y2.baseVal.value-el.y1.baseVal.value);
  const prep=el=>{const L=lineLen(el);gsap.set(el,{attr:{'stroke-dasharray':L+' '+L,'stroke-dashoffset':L}});return L;};
  // reset
  gsap.set('#logoWrap',{y:225});
  gsap.set('#logo',{opacity:0,scale:0.94,transformOrigin:'50% 50%'});
  hls.forEach(t=>gsap.set(t,{attr:{'stroke-dasharray':'900 900','stroke-dashoffset':900},fillOpacity:0,strokeOpacity:1}));
  const clamp=v=>Math.max(0,Math.min(1,v));
  // v7: guides grow upward in place from their bottom endpoints (verticals + diagonals travel upward along their own angle; horizontals from the left)
  const gGeo=guides.map(g=>{let a=[+g.dataset.x1,+g.dataset.y1],b=[+g.dataset.x2,+g.dataset.y2];
    const horiz=Math.abs(b[1]-a[1])<1;
    if(!horiz && a[1]<b[1]){const tmp=a;a=b;b=tmp;}          // a = lower end, so a->b points up
    const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1,off=0;  // v7: grow in place from the bottom endpoint (no travel)
    return {a,b,s:[a[0]-dx/d*off,a[1]-dy/d*off]};});
  guides.forEach(g=>g.setAttribute('opacity',0)); gsap.set('#guides',{opacity:1});
  gsap.set('#hairTop',{attr:{x1:380,x2:380}}); gsap.set('#hairBot',{attr:{x1:1540,x2:1540}});
  gsap.set('#tdClipL',{attr:{width:0}}); gsap.set('#tdClipR',{attr:{x:1480,width:0}}); gsap.set('#td',{y:0,opacity:1});
  gsap.set(['#b1','#b2'],{opacity:0,y:0});
  gsap.set('#bFill',{opacity:0});
  gsap.set('#bText',{opacity:0});
  gsap.set('#bLines',{attr:{opacity:0}}); gsap.set('#tdLines',{attr:{opacity:0}});

  tl=gsap.timeline({paused:true,defaults:{ease:'power2.out'}});
  // 1. logo alone, soft glow-in
  tl.to('#logo',{opacity:1,scale:1,duration:0.7,ease:'power2.out'},0.05);
  // 2. logo pushed up as INNOVATIONS is drawn
  tl.to('#logoWrap',{y:0,duration:1.0,ease:'power3.inOut'},0.85);
  tl.to(hls,{attr:{'stroke-dashoffset':0},duration:0.95,ease:'power1.inOut',stagger:0.04},3.07);  // letters start after guides settle (~3.04)
  const gStep=Math.min(0.06,0.5/Math.max(1,guides.length-1));
  // guides: CTA-style — each slides in along its own path (tail and tip travel from an offset start) and settles, staggered
  const GD=0.65, gE=gsap.parseEase('expo.out'), GP={t:0}, gTotal=GD+gStep*(guides.length-1);
  const updG=()=>{guides.forEach((g,i)=>{const q=clamp((GP.t-i*gStep)/GD),h=gE(q),G_=gGeo[i];
      g.setAttribute('x1',G_.s[0]+(G_.a[0]-G_.s[0])*h); g.setAttribute('y1',G_.s[1]+(G_.a[1]-G_.s[1])*h);
      g.setAttribute('x2',G_.s[0]+(G_.b[0]-G_.s[0])*h); g.setAttribute('y2',G_.s[1]+(G_.b[1]-G_.s[1])*h);
      g.setAttribute('opacity',q<=0?0:Math.min(1,q/0.12));});};
  tl.to(GP,{t:gTotal,duration:gTotal,ease:'none',onUpdate:updG,onStart:updG},1.9);  // starts after logo has settled (push ends 1.85); all grown by ~3.04
  tl.to(hls,{fillOpacity:1,duration:0.5,ease:'power1.inOut',stagger:0.03},3.8);
  tl.to(hls,{strokeOpacity:0,duration:0.4,stagger:0.03},4.1);
  // guides fade away once the letters are filled (same exit as the CTA outline)
  tl.to('#guides',{opacity:0,duration:0.45,ease:'power1.inOut'},4.9);  // ~0.3s breath after fill completes (~4.6), guides fade out by 5.35

  const T5=T3+1.05, X1=879, X2=1044, Y1=728, Y2=793;
  // [id, axis, travel start, edge start(corner where tail lands), edge end(corner where tip lands)]
  const sides=[['lT','x',X1-110,X1,X2],   // top: enters from the left

<script>
(function(){

/* ============================================================

const $=id=>document.getElementById(id);
const P={"blue": "#1626C6", "red": "#C7132D", "introBlue": "#090C94", "slope": 0.26875, "offDefault": 14.625, "offB": 184.625, "offR": -215.375, "gifB": {"dx": 1, "dy": -0.5, "frameMs": 40, "mockT": 2.06}, "gifR": {"dx": 7, "dy": 0, "frameMs": 80, "mockT": 1.0}, "dart": {"x": 448, "y": 251, "w": 451.5, "h": 346.5}, "hands": {"x": 459, "y": 160, "w": 521, "h": 329.5}, "ctaShift": 40};

}
// diagonal edge: x at a given y, for a split-centre offset (design px) and sweep progress
function edgeX(y,off){
  const cx=W/2+off*kd;

}
function stackEdgeY(x,off){ // stacked: near-horizontal split, blue on top
  const cy=H/2+off*kd*0.5;

}
function polys(){
  if(stack){

    const d=S.sweep*(Math.max(yl,yr,H-yl,H-yr)+8); // blue grows up, red grows down, from the line
    return {b:`polygon(0 ${yl-d}px,${W}px ${yr-d}px,${W}px ${yr}px,0 ${yl}px)`, r:`polygon(0 ${yl}px,${W}px ${yr}px,${W}px ${yr+d}px,0 ${yl+d}px)`, line:[0,yl,W,yr]};
  }
  const xt=edgeX(0,S.off), xb=edgeX(H,S.off);
  if(S.sweep>=1) return {b:`polygon(0 0,${xt}px 0,${xb}px ${H}px,0 ${H}px)`, r:`polygon(${xt}px 0,${W}px 0,${W}px ${H}px,${xb}px ${H}px)`, line:[xt,0,xb,H]};

}
const sideB=$('sideB'), sideR=$('sideR'), line=$('splitLine');

/* ---------- art placement ---------- */
function place(el,x,y,w,h){ // x,y,w,h in design px relative to the 1400×800 artboard
  el.style.width=w*kd+'px'; el.style.height=h*kd+'px';
  el.style.left=(W/2+(x-700)*kd)+'px'; el.style.top=(H/2+(y-400)*kd)+'px';

function layoutArt(){
  if(stack){
    // stacked: each GIF centred in its own half
    const w=600*kd,h=480*kd;
    for(const [id,cy] of [['artB0',H*0.27],['artR0',H*0.73]]){const e=$(id);e.style.width=w+'px';e.style.height=h+'px';e.style.left=(W-w)/2+'px';e.style.top=(cy-h/2)+'px';}

/* ---------- GIF player: WebCodecs ImageDecoder → canvas (exact colours, seekable, pausable).
   Falls back to a plain animated <img> if ImageDecoder / fetch is unavailable (e.g. file://). ---------- */
function GifPlayer(url,canvas,frameMs){
  const ctx=canvas.getContext('2d'); let dec=null,n=1,cur=-1,busy=false,t0=0,frozen=null,ok=false,pending=null;
  const self={
    ready:null,
  };
  self.ready=(async()=>{
      await 0;
      try{
        if(!('ImageDecoder' in window)||location.protocol==='file:') throw 0;
        const r=await fetch(url); if(!r.ok) throw 0;
        dec=new ImageDecoder({data:await r.arrayBuffer(),type:'image/gif'});
        await dec.tracks.ready; await dec.completed; n=dec.tracks.selectedTrack.frameCount; ok=true;
        await self.drawFrame(frozen!=null?Math.floor(frozen*1000/frameMs)%n:0);
      }catch(e){ // fallback
        const img=new Image(); img.src=url; img.alt=''; canvas.replaceWith(img); self.fallback=true;
      }
    })();
  Object.assign(self,{
    restart(){t0=now();},
    freeze(t){frozen=t;},          // seconds into the GIF; null = play
    frameAt(){const t=frozen!=null?frozen:Math.max(0,now()-t0);return Math.floor(t*1000/frameMs+1e-6)%n;},
    drawFrame(i){ if(!ok) return Promise.resolve(); busy=true;   // rev 12: the in-flight decode is always the 'pending' promise, so sync() can't spin on null
      return pending=(async()=>{ try{const {image}=await dec.decode({frameIndex:i,completeFramesOnly:true}); ctx.drawImage(image,0,0,canvas.width,canvas.height); image.close(); cur=i;}finally{busy=false;} })();},
    tick(){ if(!ok||busy) return; const i=self.frameAt(); if(i!==cur) pending=self.drawFrame(i); },
    async sync(){ if(!ok) return; while(busy) await pending; const i=self.frameAt(); if(i!==cur) await self.drawFrame(i); },
  });
  Object.defineProperty(self,'n',{get(){return n;}});
  return self;
}
const gifB=GifPlayer('assets/gifs/business-envelope.gif',$('gifB'),P.gifB.frameMs);
const gifR=GifPlayer('assets/gifs/everyone-house.gif',$('gifR'),P.gifR.frameMs);
// reduced motion: hold the mockup frames (static composite = usps_04)
function applyReduced(){ if(REDUCED){gifB.freeze(P.gifB.mockT);gifR.freeze(P.gifR.mockT);} else if(!CAPTURE){gifB.freeze(null);gifR.freeze(null);} }

/* ---------- hover state machine ---------- */
let side=null, active=false, ctaShown=false;
const D=()=>REDUCED?0:1;
function setSide(s,instant){
  if(s===side) return; side=s;
  const k=instant?0:D();
  const off= s==='B'?P.offB : s==='R'?P.offR : P.offDefault;

    gsap.to(sel,{opacity:on?1:0,x:on?0:dx,duration:(on?0.6:0.3)*kk,ease:on?'expo.out':'power2.out',overwrite:true,delay:on?0.06*kk:0});

function sideAt(x,y){ // which side of the *visible* diagonal a point is on (clicks / taps)

// equal split while the pointer crosses the centre.
const BAND=24; // design-1920 px, scaled by u (the START button centre sits ~42 px right of the resting diagonal)
function hoverAt(x,y){

}

const btn=$('btn'); if(btn) btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enter();}});

const DRAG={on:false,y0:0,st0:0,j:0,moved:false,suppress:false}, DRAG_FOLLOW=0.5, DRAG_MIN=40;
scroller.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||e.button!==0||MS.busy||!body.classList.contains('onProduct')) return;
  if(e.target.closest('button,a')) return;
  if(PS.tw){PS.tw.kill();PS.tw=null;}
  Object.assign(DRAG,{on:true,y0:e.clientY,st0:scroller.scrollTop,j:PS.near<0?0:PS.near,moved:false});
  scroller.classList.add('tweening'); body.classList.add('pDragging'); try{scroller.setPointerCapture(e.pointerId);}catch(_){}
});
scroller.addEventListener('pointermove',e=>{
  if(!DRAG.on) return; const dy=e.clientY-DRAG.y0; if(Math.abs(dy)>4) DRAG.moved=true;
  const secH=scroller.clientHeight; scroller.scrollTop=Math.max(0,Math.min((PS.n-1)*secH,DRAG.st0-dy*DRAG_FOLLOW));
});
function dragEnd(e){
  if(!DRAG.on) return; DRAG.on=false; body.classList.remove('pDragging'); const dy=e.clientY-DRAG.y0;
  let t=DRAG.j; if(dy<-DRAG_MIN) t++; else if(dy>DRAG_MIN) t--; t=Math.max(0,Math.min(PS.n-1,t));
  DRAG.suppress=DRAG.moved; goTo(t);
}
scroller.addEventListener('pointerup',dragEnd); scroller.addEventListener('pointercancel',dragEnd);
scroller.addEventListener('click',e=>{ if(DRAG.suppress){ DRAG.suppress=false; e.stopPropagation(); e.preventDefault(); } },true);
addEventListener('keydown',e=>{
  if(body.classList.contains('onProduct')){
    if(['ArrowDown','PageDown'].includes(e.key)){e.preventDefault();goTo(PS.near+1);}
    else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();goTo(PS.near-1);}
    else if(e.key==='Escape') menuFromProduct();
  } else if(body.classList.contains('onMenu')&&e.key==='Escape') closeMenu();
});
buildMenus();


/* ---------- boot ---------- */
measure();
addEventListener('resize',()=>{measure();layoutMenu();render();renderMenu();});
mqReduce.addEventListener&&mqReduce.addEventListener('change',e=>{REDUCED=e.matches;applyReduced();});
applyReduced();
gsap.ticker.add(()=>{render();renderMenu();tickProduct();menuHover();});
layoutMenu();
const goHome=/home|menu-|page-/.test(hash);
window.__introShouldAutoplay=()=>!goHome && !CAPTURE;
window.__site={
  ready:Promise.all([window.__intro&&window.__intro.ready,gifB.ready,gifR.ready,document.fonts.ready]).then(()=>{
    const mm=hash.match(/menu-(business|everyone)/), pp=hash.match(/page-(business|everyone)-([a-z-]+?)(?:&|$)/);
    if(goHome||mm||pp) showHomeInstant();
    if(mm||pp){ const s=(mm||pp)[1]==='business'?'B':'R'; openMenu(s,true);
      if(pp){ const i=MD.menus[s].items.findIndex(it=>it.key===pp[2]); if(i>=0) openProduct(s,i,true); } }
    else if(REDUCED && !CAPTURE){ window.__intro.seek(window.__intro.duration()); }
    render(); return true;}),
  enter, setSide, showHomeInstant, S, P, openMenu, closeMenu, openProduct, backToMenu, goTo, MS, PS,
  freezeGifs:(tb,tr)=>{gifB.freeze(tb);gifR.freeze(tr);},
  mockFrames:()=>{gifB.freeze(P.gifB.mockT);gifR.freeze(P.gifR.mockT);},
  // capture: advance the virtual clock (seconds) and drive GSAP from it
  step:async t=>{vNow=t; gsap.updateRoot(T0+t); render(); renderMenu(); menuHover(); await gifB.sync(); await gifR.sync(); for(const g of PGIFS) await g.sync(); render(); },
  sync:async()=>{render(); await gifB.sync(); await gifR.sync(); render();},
  showCursor:on=>body.classList.toggle('showCursor',on),
  cursorScale:k=>{curScale=k; placeCursor();},
  geometry:()=>({W,H,u,kd,off:S.off,top:edgeX(0,S.off),bottom:edgeX(H,S.off),stack})
};

})();

</script>
</body>
