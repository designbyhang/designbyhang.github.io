<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>(function(){try{var t=new URLSearchParams(location.search).get("theme")||localStorage.getItem("dbh-theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<meta name="theme-color" content="#ededed"><script>if(document.documentElement.dataset.theme==="dark")document.querySelector("meta[name=theme-color]").content="#111111"</script>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passcode screen with HANG letters (mock)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@400&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/type.css?v=70"><link rel="stylesheet" href="../../css/home.css?v=70"><link rel="stylesheet" href="../../css/gate.css?v=70"><link rel="stylesheet" href="../../css/theme.css?v=70">
<style>
/* MOCK (Hang, Oct 23): the passcode screen with the HANG letter animation centred, the field and help below it (Oct 23, 21:39: body line removed, field 20% narrower, left-aligned placeholder);
   the whole group centred horizontally and vertically. Same gate styles (css/gate.css); the logo and headline are replaced by the letters.
   Not wired to the real passcode: submitting does nothing. */
html{scrollbar-gutter:auto}
html,body{height:100%;margin:0;background:var(--page);overflow:hidden}
.gate{position:fixed}
.gate-in{display:flex;flex-direction:column;align-items:center;text-align:center;justify-self:center;margin:0 auto}
.gl-stage{width:min(320px,calc(100vw - 48px));aspect-ratio:1;margin:0 0 24px}
@media (max-width:640px){.gl-stage{width:min(240px,calc(100vw - 48px))}}
.gate-fit{margin:0 auto;width:224px}                 /* field 20% narrower than before (280 → 224 desktop) */
@media (max-width:640px){.gate-fit{width:264px}}   /* 327 → 264 on phones */
.gate-form input{text-align:left} /* placeholder and typing start at the line's left end; the arrow sits at its right end */
body .theme-btn{z-index:1001}
.gate-help{margin:0}
/* Oct 23, 21:40: DESIGN BY HANG, top right, at the homepage header's inset and type (.top padding 22px var(--side), 18px var(--m-in) on phones); plain text, not a link */
.gl-top{position:fixed;top:0;left:0;right:0;z-index:1001;display:flex;justify-content:flex-end;padding:22px var(--side);pointer-events:none}
@media (max-width:900px){.gl-top{padding-inline:var(--m-in)}}
@media (max-width:640px){.gl-top{padding:18px var(--m-in)}}
.gl-top .brand{font:var(--t-label);letter-spacing:var(--t-label-ls);word-spacing:var(--t-label-ws);color:var(--ink);text-transform:uppercase;cursor:default;user-select:none;-webkit-user-select:none}
.gl-top .brand::after{content:none}
</style>
</head>
<body>
<header class="gl-top"><span class="brand">DESIGN BY HANG</span></header>
<div class="gate" role="main">
  <div class="gate-in">
    <div class="gl-stage" role="img" aria-label="The letters H, A, N, G drawn and turning in a loop"></div>
    <div class="gate-fit"><form class="gate-form" novalidate onsubmit="return false"><label for="gate-pw" class="sr">Passcode</label><input id="gate-pw" type="password" placeholder="Enter passcode" autocomplete="off"><button type="submit" aria-label="Continue"><svg viewBox="0 0 20 14" fill="none" aria-hidden="true"><path d="M0 7H19M12.5 .5L19 7l-6.5 6.5"/></svg></button></form></div>
    <p class="gate-err" aria-hidden="true"></p>
    <p class="gate-help">Don't have one? <a href="https://www.linkedin.com/in/thisishang/" target="_blank" rel="noopener">Reach out to Hang</a>.</p>
  </div>
</div>
<script src="../../js/theme.js?v=70"></script>
<script src="../../js/hang-cube.js?v=70"></script>
<script>HangCube.mount(document.querySelector('.gl-stage'));</script>
</body>
</html>
