<style>
:root{--sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:"Bitcount Grid Single",ui-monospace,Menlo,monospace;--page:#ededed;--frame:#f4f4f4;--line:#e6e6e6;--ink:#171717;--mute:#6f6f6f;--ease:cubic-bezier(.2,.7,.2,1)}
html[data-theme=dark]{--page:#111;--line:#2a2a2a;--ink:#f2f2f2;--mute:#a6a6a6}
*{box-sizing:border-box}
*:focus,*:focus-visible{outline:none}
html,body{margin:0;background:var(--page);color:var(--ink);font:400 16px/24px var(--sans);transition:background-color .4s var(--ease),color .4s var(--ease)}
.wrap{max-width:1440px;margin:0 auto;padding:48px 48px 96px}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
header.top h1{font:var(--t-h3);letter-spacing:var(--t-h3-ls);color:var(--ink);margin:0 0 8px}
header.top p{margin:0;color:var(--mute);max-width:56ch;font-size:var(--t-s16);line-height:1.7}
.mframe{position:relative;width:100%;aspect-ratio:3840/2052;background:var(--frame);border:1px solid var(--frame-line,var(--line));overflow:hidden;contain:layout paint;transition:background-color .4s var(--ease),border-color .4s var(--ease);-webkit-tap-highlight-color:transparent}
html.deck-open .mframe{overflow:visible;contain:none}
@media (max-width:640px){.wrap{padding:24px 16px 64px}header.top{margin-bottom:24px}.mframe{aspect-ratio:4/5}}
.stage{position:absolute;left:50%;top:50%;width:375px;height:812px;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--s,.8))}
/* standalone expand button (.mbtn.proto-x) + fullscreen prototype view (identical to designbyhang.com case.css / proto-fs.css) */
.mbtn{appearance:none;display:grid;place-items:center;flex:none;width:32px;height:32px;padding:0;margin:0;border:1px solid var(--ring-media);border-radius:50%;box-sizing:border-box;background:color-mix(in srgb,var(--c-paper) 44%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 1px 4px rgba(0,0,0,.06);color:var(--c-strong);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:border-color .2s ease}
.mbtn:hover{border-color:var(--ring-hover)}
.proto-x{position:absolute;right:32px;bottom:32px;z-index:3}
@media (max-width:640px){.proto-x{right:16px;bottom:16px}}
.mbtn.proto-x svg{width:16px;height:16px;fill:none;display:block}
.mbtn.proto-x svg path{stroke:currentColor;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:miter}
.fsx-open{position:absolute;inset:0;z-index:2;width:100%;height:100%;margin:0;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
html.embed .proto-x,html.embed .fsx-open,html.deck-open .proto-x,html.deck-open .fsx-open{display:none!important}
html:not(.embed):not(.embed-full):not(.has-x) .stage{pointer-events:none}
.fsx-bg{position:fixed;inset:0;z-index:2147482998;pointer-events:none;overflow:hidden}
.fsx-bg[hidden],.fsx[hidden]{display:none}
.fsx-panel{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--frame);will-change:transform;pointer-events:auto;touch-action:none}
.fsx-bg .deck-edge{display:none;position:fixed;left:0;right:0;z-index:1;background:var(--frame);pointer-events:auto;touch-action:none}
.fsx-bg.is-open .deck-edge{display:block}
.fsx-bg .deck-edge-t{top:0;height:calc(58px + env(safe-area-inset-top,0px))}
@media (max-width:640px){.fsx-bg .deck-edge-t{height:calc(50px + env(safe-area-inset-top,0px))}}
.fsx-bg .deck-edge-b{bottom:0;height:calc(clamp(16px,3vw,32px) + env(safe-area-inset-bottom,0px))}
.fsx-bg .fsx-probe{position:fixed;left:0;width:0;top:calc(64px + env(safe-area-inset-top,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));visibility:hidden;pointer-events:none}
@media (max-width:640px){.fsx-bg .fsx-probe{top:calc(56px + env(safe-area-inset-top,0px));bottom:calc(56px + env(safe-area-inset-bottom,0px))}}
.deck-fs.fsx{position:fixed;inset:0;z-index:2147483000;overflow:hidden;pointer-events:none;outline:none;border-radius:0}
/* Right-anchored, only as wide as CLOSE (no left): a full-width fixed row is what iOS 26 Safari's top-edge sampler (it ignores pointer-events)
   takes as the top bar, and with no background it keeps the colour sampled at open; the solid .deck-edge-t strip under it (the layer colour)
   must be the edge element so the status bar follows the layer and the toggle (hang-egg.css ?v=406) */
.deck-fs.fsx .bar.deck-bar{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);height:58px;padding:0 clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:flex-end;z-index:2;background:none;pointer-events:none}
@media (max-width:640px){.deck-fs.fsx .bar.deck-bar{height:50px}}
.deck-fs.fsx .deck-bar .bar-right,.deck-fs.fsx .deck-bar a,.deck-fs.fsx .theme-btn{pointer-events:auto}
.deck-fs.fsx.is-closing .deck-bar a{pointer-events:none}
.deck-fs.fsx .theme-btn{z-index:3}
.deck-fs.fsx .deck-bar a{font-family:var(--mono)!important;font-size:14px!important;line-height:1!important;letter-spacing:.04em!important;word-spacing:-.32em!important;color:var(--c-label)!important;text-decoration:none;font-weight:400!important}
.deck-fs.fsx .deck-bar a:hover{color:var(--ink)!important}
.deck-fs.fsx .deck-bar a .t{position:relative;display:inline-block}
.deck-fs.fsx .deck-bar a .t::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.deck-fs.fsx .deck-bar a:hover .t::after{transform:scaleX(1)}
.fs-ins{--mono-color:#333;position:absolute;z-index:2;left:0;top:0;margin:0;box-sizing:content-box;overflow:clip;padding-bottom:16px;font-family:var(--mono);font-weight:400;font-style:normal;font-size:14px;line-height:1;letter-spacing:.04em;word-spacing:-.32em;text-transform:none;color:var(--mono-color);text-align:center;text-wrap:balance;pointer-events:none;-webkit-user-select:none;user-select:none}
.fs-ins span{display:block}
html[data-theme=dark] .fs-ins{--mono-color:#cfcfcf}

html.deck-lock.theme-anim,html.deck-lock.theme-anim body,html.fs-stage.theme-anim,html.fs-stage.theme-anim body,html.hegg-flow.theme-anim,html.hegg-flow.theme-anim body{transition:none!important}
html.theme-anim .fsx-bg,html.theme-anim .fsx-bg *,html.theme-anim .deck-fs.fsx,html.theme-anim .deck-fs.fsx *{transition:none!important}
.fsx-bg.is-closing .fsx-panel{pointer-events:none}
/* iOS Safari bars when fullscreen is settled (html.hegg-flow, from css/hang-egg.css): make the fullscreen layer the document in flow with
   2px of scroll range for the 1px scroll nudge so iOS 26 Safari re-samples the status bar and browser bar immediately on theme toggle */
html.hegg-flow{overflow:hidden}
@media (hover:none) and (pointer:coarse){html.hegg-flow{overflow:auto}}
html.hegg-flow,html.hegg-flow body{height:100%}
html.hegg-flow body{display:block;min-height:0;overflow:visible;margin:0;padding:0 0 2px;box-sizing:content-box}
html.hegg-flow body>.wrap{position:absolute!important;top:0!important;left:0!important;right:0!important;width:auto!important;height:0!important;min-height:0!important;overflow:hidden!important;visibility:hidden!important;pointer-events:none!important}
html.hegg-flow .stage.fsx-lift{visibility:visible!important}
html.hegg-flow .fsx-bg{position:relative;inset:auto;width:100%;height:100%;background:var(--frame);box-shadow:0 0 0 100vmax var(--frame)}
.stage.fsx-lift{position:fixed;z-index:2147482999;pointer-events:auto}
.stage.fsx-anim{pointer-events:none!important}

/* ---------- phone: 375×812 screen + 8px theme-aware bezel (the FMSS Evolution prototypes) ---------- */
.phone{position:absolute;inset:0;border-radius:40px;overflow:hidden;background:#000;isolation:isolate;user-select:none;-webkit-user-select:none;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
.bezel{position:absolute;inset:-8px;filter:drop-shadow(40px 0 20px rgba(0,0,0,.2));pointer-events:none}
.bezel-fill{position:absolute;inset:0;background:var(--bezel);border-radius:48px;transition:background-color .4s var(--ease)}
.phone img{pointer-events:none;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.L{position:absolute;left:0;top:0;display:block;margin:0}
.btn{appearance:none;border:0;padding:0;margin:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}

/* ---------- one experience: the Solution 1 / 2 split-screen recipe (surface A → split screen B → full screen C), live ---------- */
.xp{position:absolute;inset:0;display:none;background:#000}
.xp.on{display:block}
.xp img.L{width:375px;height:812px}
/* the split screen's backdrop (bu): the whole 375×734 canvas, screen-fixed (as Solution 1/2 and FMSSBackdrop); its clip-path is the
   shared open/close box — grows out of the video's current surface rect with progress p=a·(1−k) and closes back into it the same way */
.bu{left:0;top:0;width:375px;height:734px;will-change:clip-path}
.mv{position:absolute;overflow:hidden;background:#000;touch-action:none;will-change:left,top,width,height}
.rl{width:375px;height:734px;overflow:hidden}
.mv video,.rl video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.mv .mvp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}   /* still under the video: Safari shows this before the first decoded frame */
/* In-Content banner thumb play: the canonical js/play.webp (VideoScrubber's own play mark, 22×22 as it draws it), centred in the 74×74 .mv.
   assets/thumb-play.webp was an opaque RGB export (its alpha lost), so it painted as a black square. Never redraw. */
.mv .mtp{position:absolute;left:26px;top:26px;width:22px;height:22px;display:block;pointer-events:none;z-index:2}
/* In-Content: .mv must paint ABOVE .uiu — ag4-ui's thumb slot is opaque grey (same as sol2's ag4); sol2 orders .mv after ag4 so the live thumb shows through. hit stays on top for taps. */
.xp.ic .mv{z-index:2}.xp.ic .uiu{z-index:1}.xp.ic .hit{z-index:3}
/* ...which also put the live player controls under the video in split (as sol2 ?v 425):
   stack the shared control wrapper above .mv, and the sheet host above both so the full-screen IAB still covers them */
.xp.ic .ctlw{z-index:3}
.hit{z-index:auto;touch-action:none;cursor:pointer}
.hit.off{pointer-events:none}
/* one shared VideoScrubber for split and the fullscreen viewer (Hang): rides the live video box's bottom edge.
   .ctlw matches the video rect; the scrubber is bottom-anchored with --ctl-b = the split video's bottom so its trackY
   (top-14) lands on the split rest, and as the box grows/shrinks the bar translates with that edge — no second copy,
   no fade-out for the motion. Sheet host stays in front (z 10 while k>0). */
.ctlw{z-index:3;pointer-events:none;will-change:left,top,width,height,opacity}
.ctlw.off,.ctlw.off *{pointer-events:none!important}
.ctlw>.ctl{left:50%;top:auto;bottom:var(--ctl-b,394px);margin-left:-187.5px;will-change:transform,opacity}
/* expand/collapse hit: sibling of the fading .vs-f so it still answers after the idle fade (Hang: collapse button still works) */
.ctl>.ctl-ex{position:absolute;padding:0;margin:0;border:0;background:transparent;appearance:none;pointer-events:auto;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:2}
.ctl>.ctl-ex:is(:focus,:focus-visible,:active){outline:none!important}
.splx{left:325px;top:46px;width:44px;height:44px;border-radius:22px;display:none}
.splx.on{display:block}
/* the Reels ad's overlay bands (head 0–481, ui 481–734, tab bar 734–812), the ui band lifting while the reel is paused by a media tap;
   the play glyph sits at the media band's centre (the design's 375×734 canvas, not counting the tab bar) */
.uih,.uiu,.uib{pointer-events:none;object-fit:cover;object-position:0 0}
.xp img.uih{height:481px}
.xp img.uiu{height:253px;transform-origin:0 0}
.xp img.uib{height:78px}
.xp img.uis{height:253px}   /* the band's gradient scrim, cut out of the same export: it never lifts */
.uz{left:155.5px;top:335px;pointer-events:none}
.rc{left:0;top:0;width:375px;height:812px;pointer-events:none;z-index:2}   /* the paused reel's scrubber (../shared/pause), above the bands */

.vwb{width:375px;height:812px;background:#000;display:none}
.vwo{width:375px;height:812px;display:none;pointer-events:none;color:#fff;font-feature-settings:var(--t-sf-ft);-webkit-font-smoothing:antialiased}
