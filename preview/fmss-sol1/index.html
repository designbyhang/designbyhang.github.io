   read pixelated, most of all at 3x and over a light backdrop) are drawn live by .bk: the sheet colour under the same clip, with the
   handle (40x4 #C9CCD1 r2 at 168,8, as preview/shared/iab/header.js draws it for the IAB sheets). Under the sheet's corners .sk, riding

 .scr .sk,.scr .bk{width:calc(375px * var(--s,.5))}

   (and while full), so the spring's sub-pixel tail never opens a hairline of the B media between the fixed status bar and the rising header */
.cs{position:absolute;left:-4px;right:-4px;top:24px;height:28px}

.mv{position:absolute;overflow:hidden;will-change:left,top,width,height}

/* Motion ported from the Evolution prototypes. preview/fmss-hs makeSpring() (same as fmss-cb springTo(), fmss-profile spring()):

   one clock. As in the prototypes' render(), every layer is a pure function of the sheet progress: the media's x, y, width, height

   paused, through the whole C hold t2e-t3 on the frame due at t3, so it always leaves C on that frame however far its decoder lagged; the
   clip's slack over the loop, T - duration, is taken up there, behind C; a render guard hides any frame inside 7.40-8.37s). So it shows
   0:00 -> 7.12 (t1e -> t2e) before C, and 8.485 -> its end after it, wrapping to 0:00 only at the next t1e. The frame at t3
   is (t3 - t1e - (T - 15733))/1000 = 8.485s, just past the close-up, which makes the stretch from t3 round to the next t1e 15733 - 8485 = 7248ms however long the loop is: the feed, the second split and the tail cannot grow without the clip ending early,
   freezing, wrapping or slowing, so they keep their v135 lengths (2096, 2904, 408) and the 4000ms goes to the first split hold
   (+2016, 6560: video 7.12s at t2e, 280ms before the guard) and full screen (+1984, 5632). Transitions unchanged (640/560).
   Marks: t1 2096, t1e 2736, t2 9296, t2e 9856, t3 15488, t3e 16048, t4 18952, t4e 19592, T 20000. sol1's other clips (v2-v4: 8.433, 15.233,
   14.400s) keep running free on their own native loop as before (locking them too made WebKit stall on the seeks and the shared wrap) */

/* the loop as poses: a = surface → split progress, c = split → full progress, one sample every 8ms inside each transition */

    `L${w} ${f(h-p)}c0 ${A} 0 ${AB} ${-Dd} ${ABC}a${r} ${r} 0 0 1 ${-S} ${S}c${-C} ${Dd} ${-BC} ${Dd} ${-ABC} ${Dd}`+
    `L${f(p)} ${h}c${-A} 0 ${-AB} 0 ${-ABC} ${-Dd}a${r} ${r} 0 0 1 ${-S} ${-S}c${-Dd} ${-C} ${-Dd} ${-BC} ${-Dd} ${-ABC}`+
    `L0 ${f(p)}c0 ${-A} 0 ${-AB} ${Dd} ${-ABC}a${r} ${r} 0 0 1 ${S} ${-S}c${C} ${-Dd} ${BC} ${-Dd} ${ABC} ${-Dd}Z`;

const CU=['#fff','#fff','#ccd1d8','#fff'];   // bottom colour of each C screen (c1-c4 last row)

    `<img class="L a" alt="" src="${AS}a${i+1}.webp${V}">`+
    `<img class="L bt" alt="" src="${AS}bu${i+1}.webp${V}" style="height:${dp(top)}">`+
    `<div class="mv"><video muted playsinline loop preload="auto" disableremoteplayback poster="${AS}p${i+1}.webp${V}" src="${AS}v${i+1}.mp4${V}"></video></div>`+
    (VS?'<i class="vs-at"></i>':`<img class="L bc" alt="" src="${AS}bc${i+1}.webp${V}" style="height:${dp(top)}">`)+
    `<img class="L bo" alt="" src="${AS}bo${i+1}.webp${V}" style="height:${dp(top)}">`+
    `<img class="L bs" alt="" src="${AS}bl${i+1}.webp${V}" style="top:${top}px;height:${dp(812-top)}">`+
    `<i class="L bk" style="top:${top}px;height:${dp(18)};background:${SC[i]}">${HD[i]?'':`<i style="left:${dp(168)};top:${dp(8)};width:${dp(40)};height:${dp(4)};border-radius:${dp(2)}"></i>`}</i>`+
    `<i class="L cu" style="background:${CU[i]}"></i>`+

    const k={left:x.toFixed(2)+'px',top:y.toFixed(2)+'px',width:w.toFixed(2)+'px',height:h.toFixed(2)+'px'};

  // the B sheet rises from the bottom edge to the split line, then on to the top for full screen

anims.forEach(a=>{a.pause();a.currentTime=0});
/* drawn-size boxes in whole px: Chromium paints a box snapped to whole px of its own coordinate space, and a drawn-size layer's own space
   is drawn px, so a fractional drawn size (812 x .524 = 425.49) painted as 425 and, scaled back up by 1/s, stopped up to half a drawn px
   (~1 design px) short of the screen's bottom or right edge (the bezel showing through there and round the bottom corners), or ran past it,
   depending on the frame width. Each one (screen layers, bezel) is laid out at its drawn size rounded to whole px and scaled back to its
   exact design size per axis: same place, same size, nothing snapped away */
function snap(k){stage.querySelectorAll('.scr .L,.scr .rl,.bezel').forEach(e=>{let d=e._dz;
  if(!d){const c=getComputedStyle(e);d=e._dz=[Math.round(parseFloat(c.width)/k),Math.round(parseFloat(c.height)/k)]}
  const w=Math.max(1,Math.round(d[0]*k)),h=Math.max(1,Math.round(d[1]*k));e._dw=[w,h];
  e.style.width=w+'px';e.style.height=h+'px';e.style.scale=`${d[0]/w} ${d[1]/h}`})}
function fit(){const s=scl(),k=+s.toFixed(4);stage.style.setProperty('--s',k);
  if(IT)snap(k);
  if(IT&&SQ)stage.querySelectorAll('.bezel').forEach(b=>{b.firstChild.style.clipPath=`path('${squircle(b._dw[0],b._dw[1],48*k,.6)}')`});
  // the B sheet's shape (image and live top): 16px squircle top corners at drawn size; .bk's path runs the screen's height (its 18 rows sit
  // inside the corners, which a path its own height would clamp)
  if(SQ){const z=IT?k:1;stage.querySelectorAll('.bs,.bk').forEach(e=>{const w=IT?e._dw[0]:375,h=e.classList.contains('bk')?812*z:IT?e._dw[1]:812;
    e.style.clipPath=`path('${Squircle.pathR(w,h,[16*z,16*z,0,0],.6)}')`})}
  if(half&&s*(devicePixelRatio||1)>1)upgrade()}
new ResizeObserver(fit).observe(frame);fit();
let seen=false,ready=false;
/* host control (js/case.js, iframe[data-autoplay]): framed, it plays only on the host's word ({type:'demo-play'} / {type:'demo-pause'}, sent
   so that one demo on the page runs at a time); a pause freezes the clock, the videos and the sync loop where they are, and play resumes
   from there. Standalone, or with no answer to its hello within 600ms (no controller on the page), it runs on its own visibility as before */
let host=parent===window,heard=false;
if(!host){addEventListener('message',e=>{const d=e.data;if(e.source!==parent||!d||(d.type!=='demo-play'&&d.type!=='demo-pause'))return;heard=true;host=d.type==='demo-play';upd()});
  try{parent.postMessage({type:'demo-hello'},location.origin)}catch(_){}setTimeout(()=>{if(!heard){host=true;upd()}},600)}
function still(){anims.forEach(a=>{a.pause();a.currentTime=6000});vids.forEach(v=>{v.pause()})}   // reduced motion: hold the split screen (B) with the poster frame
function upd(){
  if(!ready)return;
  if(RM.matches){still();return}
  const go=seen&&host&&!document.hidden;
  anims.forEach(a=>{if(go){if(a.playState!=='running')a.play()}else if(a.playState==='running')a.pause()});
  vids.forEach(v=>{if(go){if(v.paused){const p=v.play();p&&p.catch(()=>{})}}else if(!v.paused)v.pause()});
}
Promise.all(imgs.map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve())).then(()=>{ready=true;if(RM.matches)still();upd()});
new IntersectionObserver(es=>{seen=es[es.length-1].isIntersecting;upd()},{threshold:.35}).observe(frame);
document.addEventListener('visibilitychange',upd);
RM.addEventListener&&RM.addEventListener('change',()=>{if(!RM.matches)anims.forEach(a=>a.currentTime=0);upd()});
})();
/* theme follows the site live: storage (other tabs), system setting, and the parent page's data-theme when embedded */
(function(){if(new URLSearchParams(location.search).get('theme'))return;const h=document.documentElement,mq=matchMedia('(prefers-color-scheme:dark)');const sync=()=>{let t=null;try{t=localStorage.getItem('dbh-theme')}catch(_){}if(t!=='dark'&&t!=='light')t=mq.matches?'dark':'light';if(h.getAttribute('data-theme')!==t)h.setAttribute('data-theme',t)};addEventListener('storage',e=>{if(e.key===null||e.key==='dbh-theme')sync()});mq.addEventListener('change',sync);try{if(parent!==window&&parent.document){const pd=parent.document.documentElement;new MutationObserver(()=>{const t=pd.getAttribute('data-theme');if((t==='dark'||t==='light')&&h.getAttribute('data-theme')!==t)h.setAttribute('data-theme',t)}).observe(pd,{attributes:true,attributeFilter:['data-theme']})}}catch(_){}})();
</script>
